# An nginx server for a site built by jiggle.  Change the server_name and
# root, then have certbot add TLS:
#
#   certbot --nginx -d photos.example.com
#
# which rewrites this to listen on 443 with a certificate, and to redirect
# plain HTTP there.

server {
  listen 80;
  listen [::]:80;
  server_name photos.example.com;

  root /var/www/photos.example.com;
  index index.html;

  # Directory URLs (/p/<id>/, /2008/04/) serve their index.html, and anything
  # else not found gets the site's own 404 page.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # How long browsers may keep things.  Pages, styles, scripts, and the map's
  # data change when the site does, so they're checked every time (a check
  # of an unchanged file is a quick 304).  Renditions keep their names when
  # they're remade (say, after a rotation), so they're kept only a day.
  # Pagefind's fragment and index files are named by their content, so they
  # can be kept a long time; its other files are checked.
  #
  # nginx tries regex locations in order, and uses the first that matches,
  # so /pagefind/pagefind.js is caught by the first, as it should be.
  location ~ \.(html|css|js|json)$ {
    add_header Cache-Control "no-cache";
  }

  # nginx's types don't include GeoJSON.  (A "types" block in the server
  # block would replace all the others, so it goes here.)
  location ~ \.geojson$ {
    types { }
    default_type application/geo+json;
    add_header Cache-Control "no-cache";
  }

  location ~ ^/p/[^/]+/[^/]+\.(webp|jpg|mp4)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  location ~ ^/pagefind/(fragment|index)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /pagefind/ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/geo+json;
}
