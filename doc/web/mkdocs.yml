site_name: Jiggle
site_description: >-
  Jiggle keeps a library of photos and publishes it as a static web site.
  This site documents the JMAP object types it defines.
site_url: ""
use_directory_urls: true

# From here to the nav, this file is the same as those of the Jinx manual
# (../Jinx/doc/manual), the Go booklet in gizmo, NerfLearning, and Juke, but
# for the primary color, so that the sites look alike and can still be told
# apart.  Change them together.
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - The JMAP types: types.md
